# =============================================================================
# mangala-gateway - Staging Profile
# =============================================================================
# Activated with: --spring.profiles.active=staging
# Inherits all defaults from application.yml and overrides below.
# =============================================================================

server:
  port: ${SERVER_PORT:8000}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Staging frontend origin — set via env var
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - X-Request-Id
              - X-Correlation-Id
            allowCredentials: true
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              # Staging: moderate limits — higher than dev, lower than prod
              replenishRate: ${RATE_LIMIT_REPLENISH:50}
              burstCapacity: ${RATE_LIMIT_BURST:100}
              requestedTokens: 1
            key-resolver: "#{@compositeKeyResolver}"
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback

gateway:
  # Security headers — enabled in staging to validate config before prod
  security:
    headers:
      enabled: ${SECURITY_HEADERS_ENABLED:true}
      hsts-enabled: ${SECURITY_HSTS_ENABLED:true}
      csp: ${SECURITY_CSP:default-src 'self'; script-src 'self'; object-src 'none'}
      referrer-policy: ${SECURITY_REFERRER_POLICY:strict-origin-when-cross-origin}
      permissions-policy: ${SECURITY_PERMISSIONS_POLICY:camera=(), microphone=(), geolocation=()}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:mangala}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    default-replenish-rate: ${RATE_LIMIT_REPLENISH:50}
    default-burst-capacity: ${RATE_LIMIT_BURST:100}

  policy:
    auth-service-url: ${AUTH_SERVICE_URL}
    initial-load-timeout-seconds: ${POLICY_LOAD_TIMEOUT:30}
    version-check-initial-delay-seconds: ${POLICY_VERSION_CHECK_INITIAL_DELAY:15}
    version-check-interval-seconds: ${POLICY_VERSION_CHECK_INTERVAL:60}
    fail-on-load-error: ${POLICY_FAIL_ON_LOAD_ERROR:true}
    redis-channel: ${POLICY_REDIS_CHANNEL:policy:updates}
    use-kafka: ${POLICY_USE_KAFKA:false}
    no-match-behavior: ${POLICY_NO_MATCH_BEHAVIOR:DENY}
    mtls:
      enabled: ${POLICY_MTLS_ENABLED:false}
      key-store-path: ${POLICY_MTLS_KEY_STORE_PATH:}
      key-store-password: ${POLICY_MTLS_KEY_STORE_PASSWORD:}
      key-store-type: ${POLICY_MTLS_KEY_STORE_TYPE:PKCS12}
      trust-store-path: ${POLICY_MTLS_TRUST_STORE_PATH:}
      trust-store-password: ${POLICY_MTLS_TRUST_STORE_PASSWORD:}
      trust-store-type: ${POLICY_MTLS_TRUST_STORE_TYPE:PKCS12}
    profile-guard:
      enforce-mtls-in-non-dev: ${POLICY_MTLS_ENFORCE_NON_DEV:true}
      dev-profiles: ${POLICY_DEV_PROFILES:dev,local,test}

  audit:
    enabled: ${AUDIT_ENABLED:true}
    kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    audit-allowed-requests: ${AUDIT_ALLOWED:true}
    audit-denied-requests: ${AUDIT_DENIED:true}
    audit-no-policy-requests: ${AUDIT_NO_POLICY:true}

# Actuator — expose health and metrics; restrict sensitive endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    root: INFO
    org.mangala.gateway: INFO
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
    io.github.resilience4j: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] [%X{spanId:-}] %-5level %logger{36} - %msg%n"
