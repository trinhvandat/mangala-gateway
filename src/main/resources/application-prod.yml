# =============================================================================
# mangala-gateway - Production Profile
# =============================================================================
# Activated with: --spring.profiles.active=prod
# Inherits all defaults from application.yml and overrides below.
# ALL values must be supplied via environment variables — no defaults.
# =============================================================================

server:
  port: ${SERVER_PORT:8000}

spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            # Strict CORS: only the declared production origins
            allowedOrigins: ${CORS_ALLOWED_ORIGINS}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            exposedHeaders:
              - X-Request-Id
              - X-Correlation-Id
            allowCredentials: true
            # 1 hour preflight cache
            maxAge: 3600

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - name: RequestRateLimiter
          args:
            redis-rate-limiter:
              # Production: strict limits to protect downstream services
              replenishRate: ${RATE_LIMIT_REPLENISH:100}
              burstCapacity: ${RATE_LIMIT_BURST:200}
              requestedTokens: 1
            key-resolver: "#{@compositeKeyResolver}"
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback

gateway:
  # All security headers enforced in production
  security:
    headers:
      enabled: true
      hsts-enabled: true
      csp: ${SECURITY_CSP:default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'}
      referrer-policy: ${SECURITY_REFERRER_POLICY:strict-origin-when-cross-origin}
      permissions-policy: ${SECURITY_PERMISSIONS_POLICY:camera=(), microphone=(), geolocation=(), payment=()}

  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:mangala}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

  rate-limit:
    enabled: true
    default-replenish-rate: ${RATE_LIMIT_REPLENISH:100}
    default-burst-capacity: ${RATE_LIMIT_BURST:200}

  policy:
    auth-service-url: ${AUTH_SERVICE_URL}
    initial-load-timeout-seconds: ${POLICY_LOAD_TIMEOUT:30}
    version-check-initial-delay-seconds: ${POLICY_VERSION_CHECK_INITIAL_DELAY:15}
    version-check-interval-seconds: ${POLICY_VERSION_CHECK_INTERVAL:60}
    # Hard-fail on startup if policy cannot be loaded
    fail-on-load-error: true
    redis-channel: ${POLICY_REDIS_CHANNEL:policy:updates}
    use-kafka: ${POLICY_USE_KAFKA:false}
    include-in-health-check: true
    # DENY all requests that match no policy rule
    no-match-behavior: DENY
    mtls:
      enabled: ${POLICY_MTLS_ENABLED:true}
      key-store-path: ${POLICY_MTLS_KEY_STORE_PATH}
      key-store-password: ${POLICY_MTLS_KEY_STORE_PASSWORD}
      key-store-type: ${POLICY_MTLS_KEY_STORE_TYPE:PKCS12}
      trust-store-path: ${POLICY_MTLS_TRUST_STORE_PATH}
      trust-store-password: ${POLICY_MTLS_TRUST_STORE_PASSWORD}
      trust-store-type: ${POLICY_MTLS_TRUST_STORE_TYPE:PKCS12}
    profile-guard:
      enforce-mtls-in-non-dev: true
      dev-profiles: dev,local,test

  abac:
    spel:
      enabled: true
      max-expression-length: ${ABAC_MAX_EXPR_LENGTH:500}
      evaluation-timeout-ms: ${ABAC_EVAL_TIMEOUT:100}
      max-cache-size: ${ABAC_CACHE_SIZE:1000}

  audit:
    enabled: true
    kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    batch-size: ${AUDIT_BATCH_SIZE:16384}
    linger-ms: ${AUDIT_LINGER_MS:10}
    buffer-memory: ${AUDIT_BUFFER_MEMORY:33554432}
    max-block-ms: ${AUDIT_MAX_BLOCK_MS:100}
    audit-allowed-requests: true
    audit-denied-requests: true
    audit-no-policy-requests: true

# Actuator — restrict to health and metrics only in production
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Hide internal details from unauthenticated callers
      show-details: when_authorized

# Production: WARN level — only log actionable events
logging:
  level:
    root: WARN
    org.mangala.gateway: WARN
    org.springframework.cloud.gateway: WARN
    org.springframework.security: WARN
    io.github.resilience4j: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] [%X{spanId:-}] %-5level %logger{36} - %msg%n"
